name: Validate research data

on:
  push:
    paths:
      - ".github/workflows/validate-raw.yml"
      - "collector-contract/**"
      - "samples/**"
      - "raw/**"
      - "tools/validate_raw.py"
      - "requirements-dev.txt"
  pull_request:
    paths:
      - ".github/workflows/validate-raw.yml"
      - "collector-contract/**"
      - "samples/**"
      - "raw/**"
      - "tools/validate_raw.py"
      - "requirements-dev.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate schemas, samples, and raw data
        run: python tools/validate_raw.py --paths samples raw

      - name: Reject modifications or deletions of immutable raw records
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          violations="$({
            git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- \
              raw/polling/ raw/rankings/ raw/manifests/
          } | awk '$1 != "A" { print }')"

          if [[ -n "$violations" ]]; then
            echo "Raw observations are append-only. Only newly added files are allowed:" >&2
            echo "$violations" >&2
            exit 1
          fi
