name: Manual expanded ranking trial

on:
  pull_request:
    paths:
      - ".github/workflows/manual-expanded-ranking-trial.yml"
      - "LUNA_MAX_DATA_COLLECTION_RUNBOOK.md"
      - "config/trials/manual-expanded-rankings-2026-08-02.json"
      - "docs/source-access/minecraft-jp-2026-08-02.md"
      - "requirements-collector.txt"
      - "requirements-dev.txt"
      - "tools/collect_minecraft_jp_rankings.py"
      - "tools/aggregate_rankings.py"
      - "tools/validate_raw.py"
      - "tests/test_collect_minecraft_jp_rankings.py"
      - "tests/test_validate_raw.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/manual-expanded-ranking-trial.yml"
      - "LUNA_MAX_DATA_COLLECTION_RUNBOOK.md"
      - "config/trials/manual-expanded-rankings-2026-08-02.json"
      - "docs/source-access/minecraft-jp-2026-08-02.md"
      - "requirements-collector.txt"
      - "tools/collect_minecraft_jp_rankings.py"
      - "tools/validate_raw.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-expanded-ranking-trial
  cancel-in-progress: false

jobs:
  collect-validate-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIAL_CONFIG: config/trials/manual-expanded-rankings-2026-08-02.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-collector.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Select trial root
        id: root
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            trial_root="$RUNNER_TEMP/wayfarer-trial-root"
            mkdir -p "$trial_root"
            cp -R collector-contract "$trial_root/collector-contract"
          else
            trial_root="$GITHUB_WORKSPACE"
          fi
          echo "path=$trial_root" >> "$GITHUB_OUTPUT"

      - name: Collect approved ranking scope
        shell: bash
        run: |
          python tools/collect_minecraft_jp_rankings.py \
            --config "$TRIAL_CONFIG" \
            --root "${{ steps.root.outputs.path }}" \
            | tee "$RUNNER_TEMP/collector-report.json"

      - name: Validate generated Raw data
        run: >-
          python tools/validate_raw.py
          --root "${{ steps.root.outputs.path }}"
          --paths raw

      - name: Generate Derived ranking summaries
        run: >-
          python tools/aggregate_rankings.py
          --root "${{ steps.root.outputs.path }}"
          --output "${{ steps.root.outputs.path }}/derived/ranking-snapshots"

      - name: Upload pull-request dry-run output
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: expanded-ranking-trial-dry-run
          path: |
            ${{ steps.root.outputs.path }}/raw/
            ${{ steps.root.outputs.path }}/derived/
            ${{ runner.temp }}/collector-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Verify Raw changes are additions only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          while IFS= read -r line; do
            [[ -z "$line" || "$line" == "?? "* ]] && continue
            echo "Raw observations may only be added, not modified or deleted: $line" >&2
            exit 1
          done < <(git status --porcelain -- raw)

      - name: Commit Raw observations
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/
          if ! git diff --cached --quiet; then
            git commit -m "data(ranking): collect expanded manual trial"
          fi

      - name: Commit Derived outputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git add derived/ranking-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "data(derived): aggregate expanded ranking trial"
          fi

      - name: Push trial commits
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" == "${{ github.sha }}" ]]; then
            echo "No new trial commits to push."
            exit 0
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-ranking-trial-report-${{ github.run_id }}
          path: ${{ runner.temp }}/collector-report.json
          if-no-files-found: warn
          retention-days: 7
