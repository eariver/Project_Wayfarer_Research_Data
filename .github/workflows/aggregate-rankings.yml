name: Aggregate ranking snapshots

on:
  pull_request:
    paths:
      - ".github/workflows/aggregate-rankings.yml"
      - "tools/aggregate_rankings.py"
      - "tests/test_aggregate_rankings.py"
      - "raw/rankings/**"
      - "raw/manifests/**"
  push:
    branches:
      - main
    paths:
      - "raw/rankings/**"
      - "raw/manifests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ranking-aggregation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Raw and sample data
        run: python tools/validate_raw.py --paths samples raw

      - name: Generate pull-request preview
        if: github.event_name == 'pull_request'
        run: python tools/aggregate_rankings.py --output "$RUNNER_TEMP/ranking-snapshots"

      - name: Generate Derived ranking summaries
        if: github.event_name != 'pull_request'
        run: python tools/aggregate_rankings.py

      - name: Commit Derived outputs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived/ranking-snapshots/

          if git diff --cached --quiet; then
            echo "No Derived ranking changes to commit."
            exit 0
          fi

          git commit -m "data(derived): aggregate ranking snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
